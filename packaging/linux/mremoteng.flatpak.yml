app-id: org.mremoteng.mRemoteNG
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: mremoteng

finish-args:
  # X11 + Wayland display
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  # Network access (remote connections)
  - --share=network
  # Sound (RDP audio redirect)
  - --socket=pulseaudio
  # Home directory (connection files, settings, SSH keys)
  - --filesystem=home
  # System tray (StatusNotifierItem via dbus)
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

build-options:
  env:
    # Point to .NET SDK extension
    PATH: /usr/lib/sdk/dotnet10/bin:/app/bin:/usr/bin
    PKG_CONFIG_PATH: /app/lib/pkgconfig:/usr/lib/pkgconfig
  append-path: /usr/lib/sdk/dotnet10/bin

modules:
  # ── WebKitGTK for HTTP/HTTPS protocol ──────────────────────────────────
  - name: webkitgtk
    buildsystem: cmake-ninja
    config-opts:
      - -DPORT=GTK
      - -DENABLE_MINIBROWSER=OFF
    sources:
      - type: archive
        url: https://webkitgtk.org/releases/webkitgtk-2.44.0.tar.xz
        sha256: placeholder-update-with-real-sha256

  # ── mRemoteNG.Avalonia ─────────────────────────────────────────────────
  - name: mremoteng
    buildsystem: simple
    build-commands:
      - |
        . /usr/lib/sdk/dotnet10/enable.sh
        dotnet publish mRemoteNG.Avalonia/mRemoteNG.Avalonia.csproj \
          -c Release \
          -r linux-x64 \
          --self-contained false \
          -o /app/bin \
          -p:Version=${FLATPAK_VERSION}
      - install -Dm755 packaging/linux/mremoteng.sh /app/bin/mremoteng
      - install -Dm644 packaging/linux/mremoteng.desktop /app/share/applications/org.mremoteng.mRemoteNG.desktop
      - install -Dm644 packaging/linux/org.mremoteng.mRemoteNG.metainfo.xml /app/share/metainfo/org.mremoteng.mRemoteNG.metainfo.xml
      - |
        for size in 16 32 48 64 128 256; do
          mkdir -p /app/share/icons/hicolor/${size}x${size}/apps
          # install icons when available
        done
    sources:
      - type: git
        url: https://github.com/mRemoteNG/mRemoteNG.git
        tag: v1.78.2
      - type: file
        path: packaging/linux/nuget-cache.tar.gz
        dest-filename: nuget-cache.tar.gz
