# Flatpak manifest for the cross-platform app (mRemoteNG.Avalonia).
#
# Build and install locally (from the repository root):
#   ./packaging/linux/build-flatpak.sh            # or by hand:
#   flatpak-builder --user --install-deps-from=flathub --install --force-clean \
#     build-dir/flatpak packaging/linux/mremoteng.flatpak.yml
#   flatpak run org.mremoteng.mRemoteNG
#
# The app is built from the repository's committed HEAD (the git source below), so commit
# local changes before building. NuGet packages are downloaded during the build
# (--share=network in the mremoteng module); Flathub builds offline, so a Flathub submission
# must replace that build-arg with sources generated by flatpak-dotnet-generator
# (https://github.com/flatpak/flatpak-builder-tools/tree/master/dotnet).
app-id: org.mremoteng.mRemoteNG
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
command: mremoteng

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  # Remote connections
  - --share=network
  # RDP audio redirection
  - --socket=pulseaudio
  # Connection files, settings, SSH keys and file transfers
  - --filesystem=home
  # System tray and notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications

cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # ODBC driver manager for SQL storage over ODBC. Drivers are not part of the sandbox: install
  # one under the home directory and register it in ~/.odbcinst.ini (see README).
  - name: unixodbc
    config-opts:
      - --disable-static
      - --enable-gui=no
    sources:
      - type: archive
        url: https://www.unixodbc.org/unixODBC-2.3.14.tar.gz
        sha256: 4e2814de3e01fc30b0b9f75e83bb5aba91ab0384ee951286504bb70205524771
    cleanup:
      - /bin

  # Kerberos for FreeRDP's NLA in domains (the runtime has no krb5).
  - name: krb5
    subdir: src
    config-opts:
      - --disable-static
      - --without-system-verto
      - --localstatedir=/var/lib
    sources:
      - type: archive
        url: https://kerberos.org/dist/krb5/1.22/krb5-1.22.2.tar.gz
        sha256: 3243ffbc8ea4d4ac22ddc7dd2a1dc54c57874c40648b60ff97009763554eaf13
    cleanup:
      - /bin
      - /sbin
      - /share/examples
      - /var

  # FreeRDP client (xfreerdp) for RDP connections; the app starts it as an external process.
  - name: freerdp
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_LIBDIR=lib
      - -DWITH_CLIENT_SDL=OFF
      - -DWITH_WAYLAND=OFF
      - -DWITH_SERVER=OFF
      - -DWITH_PROXY=OFF
      - -DWITH_SHADOW=OFF
      - -DWITH_SAMPLE=OFF
      - -DWITH_MANPAGES=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_SWSCALE=OFF
      - -DWITH_OPENH264=OFF
      - -DWITH_CUPS=OFF
      - -DWITH_PCSC=OFF
      - -DWITH_PKCS11=OFF
      - -DWITH_FUSE=OFF
      - -DWITH_AAD=OFF
      - -DWITH_WEBVIEW=OFF
      - -DWITH_OSS=OFF
      - -DCHANNEL_URBDRC=OFF
    sources:
      - type: archive
        url: https://github.com/FreeRDP/FreeRDP/releases/download/3.32.2/freerdp-3.32.2.tar.gz
        sha256: e95a505c0057e4d06a3b120477c421028769deba4db9c639ef3465d050f0955c
    cleanup:
      - /bin/winpr-*

  - name: mremoteng
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin
      append-ld-library-path: /usr/lib/sdk/dotnet10/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_NOLOGO: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        NUGET_PACKAGES: /run/build/mremoteng/.nuget/packages
      build-args:
        - --share=network
    build-commands:
      - |
        case "$FLATPAK_ARCH" in
          x86_64) RID=linux-x64 ;;
          aarch64) RID=linux-arm64 ;;
          *) echo "Unsupported architecture: $FLATPAK_ARCH" >&2; exit 1 ;;
        esac
        dotnet publish mRemoteNG.Avalonia/mRemoteNG.Avalonia.csproj \
          -c Release -r "$RID" --self-contained true \
          -p:PublishSingleFile=false \
          -o /app/lib/mremoteng
      - install -Dm755 packaging/linux/flatpak-launcher.sh /app/bin/mremoteng
      - install -Dm644 packaging/linux/org.mremoteng.mRemoteNG.desktop /app/share/applications/org.mremoteng.mRemoteNG.desktop
      - install -Dm644 packaging/linux/org.mremoteng.mRemoteNG.metainfo.xml /app/share/metainfo/org.mremoteng.mRemoteNG.metainfo.xml
      - install -Dm644 packaging/linux/mremoteng.png /app/share/icons/hicolor/256x256/apps/org.mremoteng.mRemoteNG.png
    sources:
      - type: git
        path: ../..
        branch: HEAD
